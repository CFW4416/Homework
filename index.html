<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фреймы с текстом</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .main-frame {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #111111;
      padding: 15px;
      border-radius: 8px;
      width: max-content;
    }

    .top-section {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .bottom-section {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .box {
      background-color: #ffffff;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      font-weight: bold;
      color: #1d1d1f;
    }

    .left-col { width: 170px; }
    .mid-col { width: 350px; }
    .right-col { width: 170px; }

    .box-a { height: 180px; }
    .box-e { height: 120px; }

    .box-b { width: 170px; height: 120px; }
    .box-c { width: 170px; height: 120px; }
    .box-f { width: 350px; height: 180px; }

    .box-d { height: 310px; }

    .box-g { width: 350px; height: 140px; }
    .box-h { width: 170px; height: 140px; }
    .box-i { width: 170px; height: 140px; }
  </style>
</head>
<body>

  <div class="main-frame">
    
    <div class="top-section">
      
      <div class="column left-col">
        <div class="box box-a"></div> 
        <div class="box box-e"></div>      
      </div>

      <div class="column mid-col">
        <div class="row">
          <div class="box box-b"></div>      
          <div class="box box-c"></div> 
        </div>
        <div class="box box-f">HSE</div> 
      </div>

      <div class="column right-col">
        <div class="box box-d"></div>      
      </div>

    </div>

    <div class="bottom-section">
      <div class="box box-g"></div>          
      <div class="box box-h"></div>         
      <div class="box box-i"></div> 
    </div>

  </div>

</body>
</html>
